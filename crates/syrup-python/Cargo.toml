[package]
name = "syrup-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syrup-runtime = { path = "../syrup-runtime" }

# Built by maturin, outside the root workspace.
[workspace]
