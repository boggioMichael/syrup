[package]
name = "extract-port"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Pilot A's readers in Rust, for their cost: the teacher network and the explicit readers built from it"

# Its own workspace: a bench beside syrup, not a member of syrup's.
[workspace]

[dependencies]
# Syrup's glyph reader (pilot A's reader 4), from this checkout, and the
# image type it reads.
syrup = { path = "../../.." }
image = { version = "0.24", default-features = false }

[profile.release]
opt-level = 3

# The readers' own code in one unit, as it was timed first; the
# dependencies (Syrup's, x11rb and zbus among them on Linux) as usual.
[profile.release.package.extract-port]
codegen-units = 1
