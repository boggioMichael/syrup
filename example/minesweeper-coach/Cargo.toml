[package]
name = "minesweeper-coach"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Watches a Minesweeper game on the screen and says, out loud, what to do next"
publish = false

[lib]
name = "mines_coach"
path = "src/lib.rs"

[[bin]]
name = "mines-coach"
path = "src/main.rs"

[dependencies]
syrup = { path = "../.." }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# The voice (SAPI), the marks' window, the console. Nothing that sends input:
# the coach never clicks.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
