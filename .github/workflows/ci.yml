name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The crates this workspace depends on, for building where crates.io
  # cannot be reached: published to the `build-cache/vendor` branch, split
  # into parts under GitHub's file-size limit. Runs only for a commit whose
  # message says [vendor]; [vendor-only] runs nothing else.
  vendor:
    if: contains(github.event.head_commit.message, '[vendor')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor
        run: |
          set -o pipefail
          cargo vendor --versioned-dirs vendor > vendor-config.toml 2> vendor.log || { cat vendor.log; exit 1; }
          du -sh vendor
          out="$RUNNER_TEMP/cache"
          mkdir -p "$out"
          tar czf "$RUNNER_TEMP/vendor.tar.gz" vendor vendor-config.toml Cargo.lock
          split -b 90m -d "$RUNNER_TEMP/vendor.tar.gz" "$out/vendor.tar.gz.part-"
          cp Cargo.lock vendor-config.toml vendor.log "$out/"
          git rev-parse HEAD > "$out/commit.txt"
          ls -l "$out"
      - name: Publish
        run: |
          cd "$RUNNER_TEMP/cache"
          git init -q && git checkout -q -b cache
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "vendored crates [skip ci]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "cache:refs/heads/build-cache/vendor"

  check:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: mkdir -p logs && cargo fmt --all -- --check
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee logs/clippy.log
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Open a window to capture
        run: .github/open-window.sh
      - name: Test
        # Includes tests/intent_native.rs, which builds an intent into a
        # shared library with cargo and loads it back, and syrup-runtime's
        # tests, which generate, compile (rustc), validate and load modules
        # and detect faces in the fixtures.
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee logs/test.log
      - name: Capture path
        # Which path the window capture took on this system (the GPU or
        # the CPU, and why), from the capture test's own report.
        run: |
          set -o pipefail
          cargo test -p syrup --lib capture::tests -- --nocapture 2>&1 | tee logs/capture.log
      - name: Build
        run: |
          set -o pipefail
          cargo build --workspace --all-targets --release 2>&1 | tee logs/build.log
      # The logs, where they can be read with git (the Actions log download
      # is not reachable from everywhere): build-output/<branch>/<os>.
      - name: Publish the logs
        if: always() && startsWith(github.ref, 'refs/heads/')
        run: |
          out="$RUNNER_TEMP/logs-out"
          mkdir -p "$out"
          cp -r logs/. "$out/" 2>/dev/null || true
          git rev-parse HEAD > "$out/commit.txt"
          echo "${{ job.status }}" > "$out/status.txt"
          cd "$out"
          git init -q && git checkout -q -b out
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "logs of ${{ github.sha }} [skip ci]"
          os="$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "out:refs/heads/build-output/$GITHUB_REF_NAME/$os"
      - name: Examples
        run: cargo run --release --example demo && cargo run --release --example intents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python in-process intents (syrup.legacy)
        run: |
          python -m pip install --quiet numpy pillow opencv-python-headless
          python python/test_legacy.py
          python python/thelip/test_thelip.py

  python:
    # The compiled operations from Python: the package built with maturin
    # and installed, then its tests (python/tests).
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/syrup-python -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint the extension
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path crates/syrup-python/Cargo.toml -- --check
          cargo clippy --manifest-path crates/syrup-python/Cargo.toml -- -D warnings
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        run: pip install "./python[test]" opencv-python-headless
      - name: Open a window to capture
        shell: bash
        run: .github/open-window.sh
      - name: Test
        run: pytest python/tests

  wayland:
    # Wayland capture, against a real PipeWire server with a stand-in for
    # the desktop's screen-cast portal (tests/portal).
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 pipewire pipewire-bin wireplumber \
            gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-base \
            python3-dbus python3-gi
      - name: Test
        run: tests/portal/run.sh

  recipes:
    # The model recipes (syrup.recipes), on real photographs. Heavy
    # dependencies, so a job of their own; elsewhere these tests skip.
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/syrup-python -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgles2
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "./python[test,yolo,mediapipe]"
      - name: Test
        run: pytest python/tests/test_recipes.py -v

  minesweeper-coach:
    # example/minesweeper-coach: its tests on Linux and on Windows, and on
    # Windows the coach live, watching a game shown on the runner's screen.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example/minesweeper-coach
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example/minesweeper-coach
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --release
      - name: A game played by doing what the coach says
        run: cargo run --release -- demo 4 --level intermediate
      - name: The coach live, watching a game on the screen
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-live.ps1
      - name: What it saw and said
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper-coach-live
          path: |
            example/minesweeper-coach/dump
            example/minesweeper-coach/live.out
            example/minesweeper-coach/live.err
            example/minesweeper-coach/expected.txt
          if-no-files-found: ignore

  example:
    # The lipreader example projects: pipeline, service, shared types, extension, web page.
    if: ${{ !contains(github.event.head_commit.message, '[vendor-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the library (the face and eye detector)
        run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install --quiet numpy opencv-python-headless pillow scipy starlette uvicorn httpx python-multipart jsonschema
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: LipNet weights and sample clips (MIT / CC BY 4.0)
        run: example/ml/models/get_lipnet.sh
      - name: Fixtures
        run: cd example/lipreader && python tests/make_fixtures.py
      - name: Pipeline tests
        run: cd example/lipreader && python tests/test_lipreader.py
      - name: Weights export round-trip
        run: python example/ml/conversion/export_lipnet_weights.py --out /tmp/lipnet.npz
      - name: API tests
        run: cd example/inference-api && python tests/test_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript
        run: |
          npm install -g typescript playwright
          npx playwright install --with-deps chromium
          cd example/shared-types && tsc -p tsconfig.json
          cd ../chrome-extension && tsc -p tsconfig.json
      - name: Extension end to end
        run: cd example/chrome-extension && NODE_PATH=$(npm root -g) node test/e2e.mjs
      - name: Web page end to end
        run: cd example/web && NODE_PATH=$(npm root -g) node test/e2e.mjs
      - name: thelip.syrup (engine against numpy, built page in Chromium)
        run: |
          cd example/thelip
          python ../ml/conversion/export_thelip_weights.py --out thelip-weights.bin --reference sbwe5n
          node test/engine.test.mjs
          node test/faces.test.mjs
          python build.py
          NODE_PATH=$(npm root -g) node test/page.test.mjs
          ffmpeg -v error -y -i test/sbwe5n.webm -pix_fmt yuv420p test/sbwe5n.y4m
          NODE_PATH=$(npm root -g) node test/camera.test.mjs
      - name: thelip-server (routes against --fake; the trained-model worker; the page's server mode)
        run: |
          python example/thelip-server/test_server.py
          cd example/thelip && NODE_PATH=$(npm root -g) node test/server.test.mjs
      - name: thelip-train (text rules, captions, utterances, the split, manifests, the Auto-AVSR patch, GRID crops)
        run: |
          python -m pip install --quiet scikit-image
          git clone -q https://github.com/amanvirparhar/chaplin.git /tmp/chaplin && git -C /tmp/chaplin checkout -q 7aee1f8fca776ce4f63690063310b53573b7d804
          git clone -q https://github.com/mpc001/auto_avsr.git /tmp/auto_avsr && git -C /tmp/auto_avsr checkout -q 182b62837773ab01052d4ac21ef1d2203ea7d267
          THELIP_CHAPLIN=/tmp/chaplin THELIP_AUTO_AVSR=/tmp/auto_avsr python example/thelip-train/test_train.py
