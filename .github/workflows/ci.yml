name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Includes tests/intent_native.rs, which builds an intent into a
        # shared library with cargo and loads it back.
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace --all-targets --release
      - name: Examples
        run: cargo run --release --example demo && cargo run --release --example intents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python package
        run: |
          python -m pip install --quiet numpy pillow
          python python/test_syrup.py
