name: Pages

# Publishes docs/ (thelip.syrup and the demo pages) to the gh-pages branch,
# which GitHub Pages serves at https://boggiomichael.github.io/syrup/.
# Pages was enabled by the first push of that branch; nothing to click.
# Each run adds one commit to gh-pages whose tree is docs/ as it is on the
# pushed commit, and skips the commit when nothing under docs/ changed.
# server.json is the exception: thelip-server writes the running server's
# address there (run.py's publish_pointer), so the copy on gh-pages is kept
# over the repository's placeholder.
on:
  push:
    branches: [main, claude/intents-2]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit docs/ to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -eu
          if git fetch --depth 1 origin gh-pages; then
            parent=$(git rev-parse FETCH_HEAD)
            if git cat-file -e "$parent:server.json" 2>/dev/null; then
              git show "$parent:server.json" > docs/server.json   # the running server's address stays
              git add docs/server.json
            fi
          fi
          tree=$(git write-tree --prefix=docs/)
          if [ -n "${parent:-}" ]; then
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "gh-pages already has docs/ from this tree; nothing to publish"
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p "$parent" -m "pages: docs/ at ${GITHUB_SHA::7}")
          else
            commit=$(git commit-tree "$tree" -m "pages: docs/ at ${GITHUB_SHA::7}")
          fi
          git push origin "$commit:refs/heads/gh-pages"
          echo "published $commit to gh-pages"
